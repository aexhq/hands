[workspace]
resolver = "3"
members = ["crates/hand-guest", "crates/hand-lambda", "crates/hand-brain-aws"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aexhq/hands"

[workspace.dependencies]
# Brain owns the protocol and Hand ports. All three packages resolve from one immutable source
# identity so Hands can build without a sibling checkout and cannot drift across contracts.
brain = { git = "https://github.com/aexhq/brain.git", rev = "372871cf4a523b16bdfce98d07dfc00051fbe2a8" }
brain-protocol = { git = "https://github.com/aexhq/brain.git", rev = "372871cf4a523b16bdfce98d07dfc00051fbe2a8" }
brain-hand-client = { git = "https://github.com/aexhq/brain.git", rev = "372871cf4a523b16bdfce98d07dfc00051fbe2a8" }
brain-aws = { git = "https://github.com/aexhq/brain.git", rev = "372871cf4a523b16bdfce98d07dfc00051fbe2a8" }
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "credentials-process", "default-https-client", "rt-tokio", "sso"] }
aws-sdk-lambdamicrovms = { version = "1.3", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
bytes = "1"
filetime = "0.2"
futures-util = "0.3"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
hex = "0.4"
ignore = "0.4"
jsonschema = { version = "0.49", default-features = false }
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1"
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
