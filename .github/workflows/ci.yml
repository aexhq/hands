name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Proves the guest works inside the built image, on the runner's native arch. The production
  # ARM64 image is built on an arm host / via buildx separately.
  image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Build guest and client (native)
        run: |
          cargo build -p hand-guest --release
          cargo build -p hand-client --example smoke --release
      - name: Build image and drive a session
        run: |
          docker build -f image/Dockerfile --build-arg BIN=target/release/hand-guest -t aex-hand:ci .
          TOKEN=ci-smoke
          CID=$(docker run -d --rm -p 7000:7000 -e AEX_HAND_TOKEN=$TOKEN aex-hand:ci)
          for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/7000) 2>/dev/null && { exec 3>&-; sleep 1; break; }; sleep 0.5; done
          ./target/release/examples/smoke ws://127.0.0.1:7000/ $TOKEN || { docker logs "$CID"; exit 1; }
          docker stop "$CID"
