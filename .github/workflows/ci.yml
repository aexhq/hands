name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  image-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Cross toolchain for musl/arm64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static binfmt-support
      - name: Build guest (static musl arm64)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p hand-guest --release --target aarch64-unknown-linux-gnu
      - name: Build client smoke example
        run: cargo build -p hand-client --example smoke --release
      - name: Build image and drive a session
        run: |
          docker build -f image/Dockerfile \
            --build-arg BIN=target/aarch64-unknown-linux-gnu/release/hand-guest \
            -t aex-hand:ci .
          TOKEN=ci-smoke
          CID=$(docker run -d --rm -p 7000:7000 -e AEX_HAND_TOKEN=$TOKEN aex-hand:ci)
          for i in $(seq 1 40); do nc -z 127.0.0.1 7000 && { sleep 1; break; }; sleep 0.5; done
          ./target/release/examples/smoke ws://127.0.0.1:7000/ $TOKEN
          docker stop $CID
